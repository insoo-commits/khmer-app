<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ee"/>
      <stop offset=".45" stop-color="#c9e7f3"/>
      <stop offset=".75" stop-color="#f4ecd4"/>
      <stop offset="1" stop-color="#fbe9b8"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6e2"/>
      <stop offset="1" stop-color="#5c9fb8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8821f"/>
      <stop offset=".5" stop-color="#f3cd58"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".6" stop-color="#ffd977" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd977" stop-opacity="0"/>
    </radialGradient>
    <g id="spire">
      <path d="M0 -70 C3 -50 6 -30 7 0 L-7 0 C-6 -30 -3 -50 0 -70Z"/>
      <rect x="-10" y="0" width="20" height="10" rx="2"/>
    </g>
    <g id="palm">
      <path d="M0 0 C2 -30 4 -60 0 -90" stroke="#2f5a46" stroke-width="5" fill="none"/>
      <g fill="#2f5a46">
        <path d="M0 -90 C-20 -100 -40 -95 -55 -80 C-35 -88 -18 -88 0 -86Z"/>
        <path d="M0 -90 C20 -102 42 -98 58 -82 C38 -90 18 -90 0 -86Z"/>
        <path d="M0 -90 C-12 -110 -30 -118 -48 -116 C-28 -108 -14 -100 0 -88Z"/>
        <path d="M0 -90 C12 -112 32 -120 50 -116 C30 -108 14 -100 0 -88Z"/>
        <path d="M0 -92 C-2 -110 2 -124 8 -132 C4 -116 3 -104 0 -90Z"/>
      </g>
    </g>
    <g id="champa">
      <g fill="#fffaf0">
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(0)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(72)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(144)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(216)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="14" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#f6c443"/>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle cx="860" cy="196" r="70" fill="url(#sun)"/>
  <circle cx="860" cy="196" r="30" fill="#fff6d5" opacity=".9"/>

  <!-- distant mountains -->
  <path d="M0 210 L80 170 L150 195 L240 150 L330 190 L420 160 L520 200 L600 175 L700 205 L1200 205 L1200 300 L0 300Z" fill="#9cc4a6" opacity=".7"/>
  <path d="M500 215 L620 168 L720 200 L830 160 L940 198 L1040 165 L1130 192 L1200 175 L1200 300 L500 300Z" fill="#6f9f86" opacity=".85"/>

  <!-- water -->
  <rect y="228" width="1200" height="72" fill="url(#river)"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M820 240 H900"/><path d="M835 250 H885"/><path d="M845 260 H875"/>
    <path d="M300 255 H340"/><path d="M560 268 H610"/><path d="M1000 262 H1050"/>
  </g>

  <!-- Angkor Wat on the bank -->
  <g transform="translate(700 228)" fill="url(#gold)">
    <rect x="-190" y="-10" width="380" height="10" fill="#7a4e2a"/>
    <rect x="-175" y="-26" width="350" height="16" rx="2"/>
    <rect x="-120" y="-44" width="240" height="18" rx="2"/>
    <rect x="-70" y="-60" width="140" height="16" rx="2"/>
    <g id="twr"><path d="M-13 0 C-15 -16 -12 -30 -8 -42 C-6 -52 -3 -60 0 -72 C3 -60 6 -52 8 -42 C12 -30 15 -16 13 0Z"/><path d="M-12 -14 H12 M-10 -28 H10 M-7 -42 H7" stroke="#8a5f17" stroke-width="1.6" fill="none" opacity=".6"/></g>
    <use href="#twr" transform="translate(0 -60) scale(1.45)"/>
    <use href="#twr" transform="translate(-58 -44) scale(1.05)"/>
    <use href="#twr" transform="translate(58 -44) scale(1.05)"/>
    <use href="#twr" transform="translate(-150 -26) scale(.85)"/>
    <use href="#twr" transform="translate(150 -26) scale(.85)"/>
    <g fill="#7a4e2a" opacity=".55"><rect x="-6" y="-24" width="12" height="14"/><rect x="-100" y="-22" width="6" height="10"/><rect x="-80" y="-22" width="6" height="10"/><rect x="-40" y="-22" width="6" height="10"/><rect x="34" y="-22" width="6" height="10"/><rect x="74" y="-22" width="6" height="10"/><rect x="94" y="-22" width="6" height="10"/></g>
  </g>
  <!-- reflection -->
  <g transform="translate(700 230) scale(1 -.35)" opacity=".22" fill="#ffd36b">
    <rect x="-175" y="-44" width="350" height="44"/>
    <path d="M-19 -60 C-22 -85 -10 -120 0 -165 C10 -120 22 -85 19 -60Z"/>
    <path d="M-72 -44 C-73 -70 -64 -95 -58 -120 C-52 -95 -43 -70 -44 -44Z"/><path d="M44 -44 C43 -70 52 -95 58 -120 C64 -95 73 -70 72 -44Z"/>
  </g>

  <!-- palms -->
  <use href="#palm" transform="translate(470 232) scale(.9)"/>
  <use href="#palm" transform="translate(505 234) scale(.7)"/>
  <use href="#palm" transform="translate(955 232) scale(1)"/>
  <use href="#palm" transform="translate(1000 236) scale(.75)"/>
  <use href="#palm" transform="translate(1150 236) scale(1.1)"/>

  <!-- long-tail boat -->
  <g transform="translate(1040 268)" fill="#2f5a46">
    <path d="M-60 0 C-40 8 30 8 60 -4 L56 2 C30 12 -40 12 -62 4Z"/>
    <path d="M-20 -4 L-18 -24 L-14 -4Z"/>
    <circle cx="-16" cy="-28" r="4"/>
  </g>

  <!-- flowers -->
  <use href="#champa" transform="translate(1150 52) scale(1.3)"/>
  <use href="#champa" transform="translate(1100 30) scale(.9)"/>
  <use href="#champa" transform="translate(1180 110) scale(.8)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
